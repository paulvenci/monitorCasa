name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          cp js/config.js.template js/config.js
          sed -i "s|{{SUPABASE_URL}}|${{ secrets.SUPABASE_URL }}|g" js/config.js
          sed -i "s|{{SUPABASE_ANON_KEY}}|${{ secrets.SUPABASE_ANON_KEY }}|g" js/config.js

      - name: Verify Files
        run: |
          echo "Listing js directory:"
          ls -l js/
          echo "Checking if js/config.js was created:"
          if [ -f js/config.js ]; then echo "js/config.js exists"; else echo "js/config.js MISSING"; exit 1; fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
